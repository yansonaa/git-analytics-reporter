services:
  postgres:
    image: postgres:16-alpine
    container_name: git-analytics-postgres
    environment:
      POSTGRES_DB: git_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d git_analytics" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: git-analytics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: git-analytics-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
    volumes:
      - git_clones:/tmp/git-clones

volumes:
  postgres_data:
  redis_data:
  git_clones:
